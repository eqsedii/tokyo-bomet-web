<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tokyo Bomet - Feed</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="home.css">
</head>
<body>

<video class="bg-video-dim" autoplay muted loop playsinline>
  <source src="https://res.cloudinary.com/kihyxfyk/video/upload/v1787894937/lv_0_20260828082227.mp4" type="video/mp4">
</video>
<div class="bg-glow-overlay"></div>
<div class="bg-dark-tint"></div>

<div id="loading-screen"><div class="loader-logo">TOKYO BOMET</div></div>

<header class="top-bar">
  <div class="brand-mini">TOKYO <span>BOMET</span></div>
  <div class="top-actions">
    <a href="cart.html" class="cart-btn">🛒 <span id="cartCount" class="cart-count">0</span></a>
    <button class="icon-btn" onclick="handleLogout()">Logout</button>
  </div>
</header>

<nav class="bottom-nav">
  <a href="home.html" class="nav-item active">Feed</a>
  <a href="cart.html" class="nav-item">Cart</a>
  <a href="about.html" class="nav-item">About</a>
  <a href="contact.html" class="nav-item">Reach Us</a>
</nav>

<div id="categoryBar" class="category-bar"></div>

<div id="recBanner"></div>

<div id="feed" class="feed-grid"></div>

<!-- Product Detail Modal -->
<div id="productModal" class="product-modal">
  <div class="product-modal-box">
    <button class="modal-close" onclick="closeProductModal()">✕</button>
    <div class="detail-media-viewer" id="detailMediaViewer"></div>
    <div id="detailDots" class="media-dots"></div>
    <div class="detail-info">
      <div class="detail-top-row">
        <span id="detailCategory" class="cat-tag"></span>
        <span id="detailPrice" class="price-tag"></span>
      </div>
      <h3 id="detailName" class="detail-name"></h3>
      <p id="detailCaption" class="detail-caption"></p>
      <div class="detail-actions">
        <button id="detailCartBtn" class="btn-primary-full">🛒 Add to Cart</button>
        <button id="detailLoveBtn" class="btn-secondary-full">💛 Send what you've loved</button>
      </div>
    </div>
  </div>
</div>

<div id="requestModal" class="modal">
  <div class="modal-box">
    <h3>What did you love?</h3>
    <input type="text" id="reqName" placeholder="Item name">
    <textarea id="reqDesc" placeholder="Describe it (size, color, etc.)"></textarea>
    <p class="error-msg" id="reqError"></p>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="sendRequest()">Send</button>
    </div>
  </div>
</div>

<script type="module">
  import { auth, db } from './firebase-config.js';
  import { showToast } from './toast.js';
  import { onAuthStateChanged, signOut }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { collection, addDoc, getDocs, doc, getDoc, setDoc, query, orderBy, where }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  function showLoading(show) {
    document.getElementById('loading-screen').classList.toggle('active', show);
  }

  function optimizeUrl(url) {
    if (!url || !url.includes('/upload/')) return url;
    return url.replace('/upload/', '/upload/q_auto,f_auto/');
  }

  function formatPrice(price) {
    const n = Number(price);
    if (!n || isNaN(n)) return '';
    return 'KES ' + n.toLocaleString();
  }

  let currentUser = null;
  let currentSourceId = null;
  let activeCategory = 'All';
  let allProducts = [];
  let detailSlideIndex = 0;
  let currentDetailProduct = null;

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "index.html";
    } else {
      currentUser = user;
      logVisit(user.uid);
      loadCategories();
      loadFeed();
      loadRecommendations(user.uid);
      updateCartCount();
    }
  });

  async function logVisit(uid) {
    try {
      const today = new Date().toISOString().slice(0, 10);
      await addDoc(collection(db, "visits"), {
        userId: uid, date: today, timestamp: new Date().toISOString()
      });
    } catch (e) { /* silent fail */ }
  }

  async function updateCartCount() {
    try {
      const cartDoc = await getDoc(doc(db, "carts", currentUser.uid));
      const items = cartDoc.exists() ? (cartDoc.data().items || []) : [];
      const total = items.reduce((sum, it) => sum + (it.qty || 1), 0);
      document.getElementById('cartCount').innerText = total;
    } catch (e) { /* ignore */ }
  }

  window.addToCart = async function(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    showLoading(true);
    try {
      const cartRef = doc(db, "carts", currentUser.uid);
      const cartDoc = await getDoc(cartRef);
      let items = cartDoc.exists() ? (cartDoc.data().items || []) : [];
      const existing = items.find(it => it.productId === productId);
      if (existing) {
        existing.qty = (existing.qty || 1) + 1;
      } else {
        const thumb = (product.media && product.media[0]) || null;
        items.push({
          productId: productId,
          name: product.name || 'Item',
          category: product.category || '',
          price: product.price || 0,
          thumbUrl: thumb ? thumb.url : '',
          thumbType: thumb ? thumb.type : 'photo',
          qty: 1,
          addedAt: new Date().toISOString()
        });
      }
      await setDoc(cartRef, { items });
      await updateCartCount();
      showLoading(false);
      showToast("💛 Added to cart!");
    } catch (e) {
      showLoading(false);
      showToast("Could not add to cart. Try again.");
    }
  }

  async function loadCategories() {
    const bar = document.getElementById('categoryBar');
    bar.innerHTML = '<button class="cat-pill active" data-cat="All">All</button>';
    try {
      const q = query(collection(db, "categories"), orderBy("name"));
      const snap = await getDocs(q);
      snap.forEach((docSnap) => {
        const c = docSnap.data();
        const btn = document.createElement('button');
        btn.className = 'cat-pill';
        btn.dataset.cat = c.name;
        btn.innerText = c.name;
        bar.appendChild(btn);
      });
    } catch (e) { /* ignore */ }

    bar.querySelectorAll('.cat-pill').forEach(btn => {
      btn.addEventListener('click', () => {
        bar.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCategory = btn.dataset.cat;
        renderFeed();
      });
    });
  }

  async function loadRecommendations(uid) {
    const banner = document.getElementById('recBanner');
    try {
      const q = query(collection(db, "recommendations"), where("userId", "==", uid));
      const snap = await getDocs(q);
      if (!snap.empty) {
        banner.innerHTML = '';
        snap.forEach((docSnap) => {
          const r = docSnap.data();
          const card = document.createElement('div');
          card.className = 'rec-card';
          card.innerHTML = `
            <p class="rec-label">✨ Tokyo Bomet recommends for you</p>
            <img src="${r.photoUrl}" class="rec-img">
            <p class="rec-msg">${r.message || ''}</p>
          `;
          banner.appendChild(card);
        });
      }
    } catch (e) { /* no recommendations yet */ }
  }

  async function loadFeed() {
    showLoading(true);
    allProducts = [];
    try {
      const q = query(collection(db, "products"), orderBy("createdAt", "desc"));
      const snap = await getDocs(q);
      snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
    } catch (e) { /* ignore */ }
    renderFeed();
    showLoading(false);
  }

  function renderFeed() {
    const feedDiv = document.getElementById('feed');
    feedDiv.innerHTML = '';
    const filtered = activeCategory === 'All'
      ? allProducts
      : allProducts.filter(p => p.category === activeCategory);

    if (filtered.length === 0) {
      feedDiv.innerHTML = '<p class="empty-msg">No products in this category yet.</p>';
      return;
    }

    filtered.forEach(product => {
      const thumb = (product.media && product.media[0]) || null;
      const priceLabel = formatPrice(product.price);
      const outOfStock = product.inStock === false;

      const card = document.createElement('div');
      card.className = 'grid-card';
      card.dataset.productId = product.id;
      card.innerHTML = `
        <div class="grid-thumb-wrap">
          ${thumb
            ? (thumb.type === 'video'
                ? `<video src="${optimizeUrl(thumb.url)}" class="grid-thumb" muted playsinline></video>`
                : `<img src="${optimizeUrl(thumb.url)}" class="grid-thumb">`)
            : `<div class="grid-thumb"></div>`}
          ${product.category ? `<span class="grid-cat-tag">${product.category}</span>` : ''}
          ${outOfStock ? `<span class="grid-soldout">SOLD OUT</span>` : `
            <button class="grid-cart-icon" data-id="${product.id}">🛒</button>
          `}
          ${(product.media && product.media.length > 1) ? `<span class="grid-media-count">${product.media.length}</span>` : ''}
        </div>
        <div class="grid-info">
          <p class="grid-name">${product.name || 'Item'}</p>
          ${priceLabel ? `<p class="grid-price">${priceLabel}</p>` : ''}
        </div>
      `;
      feedDiv.appendChild(card);
    });

    document.querySelectorAll('.grid-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('grid-cart-icon')) return;
        openProductDetail(card.dataset.productId);
      });
    });
    document.querySelectorAll('.grid-cart-icon').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        addToCart(btn.dataset.id);
      });
    });
  }

  window.openProductDetail = function(productId) {
    const product = allProducts.find(p => p.id === productId);
    if (!product) return;
    currentDetailProduct = product;
    detailSlideIndex = 0;
    renderDetailModal();
    document.getElementById('productModal').classList.add('active');
  }

  function renderDetailModal() {
    const product = currentDetailProduct;
    const media = product.media || [];
    const viewer = document.getElementById('detailMediaViewer');
    const dots = document.getElementById('detailDots');

    viewer.innerHTML = media.map((m, i) => `
      <div class="media-slide ${i === detailSlideIndex ? 'active' : ''}">
        ${m.type === 'video'
          ? `<video src="${optimizeUrl(m.url)}" controls playsinline preload="metadata" class="detail-media"></video>`
          : `<img src="${optimizeUrl(m.url)}" class="detail-media">`}
      </div>
    `).join('') + (media.length > 1 ? `
      <button class="media-nav prev" id="detailPrev">‹</button>
      <button class="media-nav next" id="detailNext">›</button>
    ` : '');

    dots.innerHTML = media.length > 1
      ? media.map((_, i) => `<span class="dot ${i === detailSlideIndex ? 'active' : ''}"></span>`).join('')
      : '';

    document.getElementById('detailCategory').innerText = product.category || '';
    document.getElementById('detailPrice').innerText = formatPrice(product.price);
    document.getElementById('detailName').innerText = product.name || 'Item';
    document.getElementById('detailCaption').innerText = product.caption || '';

    const cartBtn = document.getElementById('detailCartBtn');
    if (product.inStock === false) {
      cartBtn.innerText = 'Sold Out';
      cartBtn.disabled = true;
    } else {
      cartBtn.innerText = '🛒 Add to Cart';
      cartBtn.disabled = false;
      cartBtn.onclick = () => addToCart(product.id);
    }

    document.getElementById('detailLoveBtn').onclick = () => openModal(product.id, product.name);

    if (media.length > 1) {
      document.getElementById('detailPrev').onclick = () => changeDetailSlide(-1);
      document.getElementById('detailNext').onclick = () => changeDetailSlide(1);
    }
  }

  function changeDetailSlide(delta) {
    const media = currentDetailProduct.media || [];
    detailSlideIndex = (detailSlideIndex + delta + media.length) % media.length;
    renderDetailModal();
  }

  window.closeProductModal = function() {
    document.getElementById('productModal').classList.remove('active');
  }

  window.openModal = function(id, name) {
    currentSourceId = id;
    document.getElementById('reqName').value = name || '';
    document.getElementById('reqDesc').value = '';
    document.getElementById('reqError').innerText = '';
    document.getElementById('requestModal').classList.add('active');
  }

  window.closeModal = function() {
    document.getElementById('requestModal').classList.remove('active');
  }

  window.sendRequest = async function() {
    const name = document.getElementById('reqName').value.trim();
    const desc = document.getElementById('reqDesc').value.trim();
    const errorMsg = document.getElementById('reqError');
    if (!name || !desc) { errorMsg.innerText = "Please fill both fields"; return; }
    showLoading(true);
    try {
      const userDoc = await getDoc(doc(db, "users", currentUser.uid));
      const username = userDoc.exists() ? userDoc.data().username : currentUser.email;
      await addDoc(collection(db, "requests"), {
        userId: currentUser.uid,
        username: username,
        email: currentUser.email,
        sourceId: currentSourceId,
        sourceType: "product",
        itemName: name,
        description: desc,
        status: "pending",
        adminReply: "",
        createdAt: new Date().toISOString()
      });
      showLoading(false);
      closeModal();
      showToast("Sent! Tokyo Bomet will get back to you soon.");
    } catch (e) {
      errorMsg.innerText = "Failed to send. Try again.";
      showLoading(false);
    }
  }

  window.handleLogout = async function() {
    await signOut(auth);
    window.location.href = "index.html";
  }
</script>
</body>
</html>
